<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Imagen</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/galeria/navigation.css">
  <link rel="stylesheet" href="styles/imagen/imagen.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="icon" href="assets/Icono.png" type="image/png">
</head>
<body class="gallery-page">
  <nav class="navigation">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="index.html"><h1>Portfolio</h1></a>
      </div>
      <div class="nav-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html">Home</a></li>
        <li class="nav-item"><a href="gallery.html" class="active">Gallery</a></li>
      </ul>
    </div>
  </nav>

  <div class="imagen-detalle" id="imagen-detalle">
    <p class="loading">Cargando imagen...</p>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <h3>Portfolio</h3>
          <p>For <strong>commissions</strong>, <strong>collaborations</strong>, or <strong>miniature sales</strong><br>feel free to get in touch.</p>
        </div>
        <div class="footer-links">
          <h4>Quick Links</h4>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
          </ul>
        </div>
        <div class="footer-social">
          <h4>Contact</h4>
          <div class="social-icons">
            <a href="https://www.youtube.com/@pijuelas" aria-label="YouTube"><span>YouTube</span></a>
            <a href="https://x.com/El_Pijuelas" aria-label="Twitter"><span>Twitter</span></a>
            <a href="mailto:elpijuelas@email.com" aria-label="Email"><span>Email</span></a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; <span id="current-year"></span> Pijuelas. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="scripts/imagen.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const y = document.getElementById('current-year');
      if (y) y.textContent = new Date().getFullYear();
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');
      if (navToggle && navMenu) navToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
      window.addEventListener('scroll', () => {
        const nav = document.querySelector('.navigation');
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 20);
      });
    });
  </script>
</body>
</html>
